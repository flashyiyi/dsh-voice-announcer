# dsh-voice-announcer 装配补丁：通过 `dsh plugin add` 安装时自动插入此配置。
# 用户可在自己 profile 的 cordis.patch.yml 里覆盖这些配置（引擎/音色/开关等）。
#
# `name` 是 loader 解析的包名（安装后从 profile 的 node_modules 解析），必须与
# package.json 的 name 一致；`id` 是 loader entry id。
# 0.2.0 起 settings 命名空间 = entry id，故 id 固定为 `voice-announcer`：
# host 侧 src/index.ts 与 web 设置卡片都按这个 ns 读写配置。
- insert:
    - id: voice-announcer
      name: 'dsh-voice-announcer'
      config:
        enabled: true
        engine: edge-tts
        voices: [] # 空 = 未筛选，使用全部中文音色
        announceCompleted: true
        announceError: true
        announceSubagent: false
        announceWait: true
        liveRead: true
        liveReadActiveOnly: false
        overlapLive: true
        liveReadMaxQueue: 5
        debugLog: false
